name: Deploy Docker Container to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: EC2  # <--- THIS TELLS GITHUB TO READ THE ENVIRONMENT SECRETS
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/React-Multi-Language-App-i18next-Tutorial-with-React-JS
            cd ~/React-Multi-Language-App-i18next-Tutorial-with-React-JS

            if [ ! -d ".git" ]; then
              git clone https://github.com/TayyabALi32/React-Multi-Language-App-i18next-Tutorial-with-React-JS.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            cat << 'EOF' > vite.config.js
            import { defineConfig } from 'vite'
            import react from '@vitejs/plugin-react'

            export default defineConfig({
              plugins: [react()],
              base: '/',
            })
            EOF

            docker build --no-cache -t react-multilang-app .
            docker stop react-app || true
            docker rm react-app || true
            docker run -d --name react-app --restart unless-stopped -p 80:80 react-multilang-app
            docker image prune -f
