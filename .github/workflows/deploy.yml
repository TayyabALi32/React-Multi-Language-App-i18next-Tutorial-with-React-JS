name: Deploy Docker Container to AWS EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: EC2
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pre-flight SSH Connection Test
        run: |
          echo "Testing connection to EC2 host: ${{ secrets.EC2_HOST }} on port 22..."
          nc -zv -w 10 ${{ secrets.EC2_HOST }} 22 || {
            echo "--------------------------------------------------------"
            echo "ERROR: Could not connect to EC2 on port 22 (Connection Timed Out)."
            echo "Please check the following:"
            echo "1. Is your EC2_HOST secret set to your instance's PUBLIC IPv4 address?"
            echo "2. Has your EC2 public IP changed because the instance was stopped/restarted?"
            echo "3. Is Port 22 in your EC2 Security Group allowed from 0.0.0.0/0?"
            echo "--------------------------------------------------------"
            exit 1
          }

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p ~/React-Multi-Language-App-i18next-Tutorial-with-React-JS
            cd ~/React-Multi-Language-App-i18next-Tutorial-with-React-JS

            if [ ! -d ".git" ]; then
              git clone https://github.com/TayyabALi32/React-Multi-Language-App-i18next-Tutorial-with-React-JS.git .
            else
              git fetch --all
              git reset --hard origin/${{ github.ref_name }}
            fi

            cat << 'EOF' > vite.config.js
            import { defineConfig } from 'vite'
            import react from '@vitejs/plugin-react'

            export default defineConfig({
              plugins: [react()],
              base: '/',
            })
            EOF

            docker build --no-cache -t react-multilang-app .
            docker stop react-app || true
            docker rm react-app || true
            docker run -d --name react-app --restart unless-stopped -p 80:80 react-multilang-app
            docker image prune -f
